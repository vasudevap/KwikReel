<!doctype html>
<meta charset="utf-8">
<title>WO-124 · playback engine spike</title>
<style>
  body { font: 13px ui-monospace, monospace; background:#111; color:#ddd; margin:12px; }
  #stage { display:flex; gap:8px; }
  video { width:180px; background:#000; }
  #log { white-space:pre-wrap; margin-top:12px; max-height:60vh; overflow:auto; }
</style>

<div id="stage">
  <video id="vA" playsinline muted preload="auto"></video>
  <video id="vB" playsinline muted preload="auto"></video>
  <video id="vAudio" playsinline preload="auto"></video>
</div>
<audio id="music" preload="auto"></audio>
<div id="log">idle — call run()</div>

<script>
// WO-124 · THROWAWAY. Answers SPEC.md §6 with measurements.
//
// Every number here depends on knowing exactly which frame is on screen, so the
// fixtures burn a 9-bit index into nine large black/white blocks (see
// build_fixtures.py). Reading it back is a threshold on nine pixels, which
// survives yuv420p and H.264 quantisation in a way a gradient or a timecode
// overlay would not.

const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

let FIX = null;
const R = { env: {}, tests: {} };

// --- frame identification -------------------------------------------------

const cv = document.createElement('canvas');
const cx = cv.getContext('2d', { willReadFrequently: true });

// The proxy is a fixed 540x960 with the source letterboxed inside it, so the
// code blocks are inside the CONTENT rect, not the frame. Portrait sources fill
// it; landscape ones sit in a band.
function contentRect(v, srcW, srcH) {
  const W = v.videoWidth, H = v.videoHeight;
  const s = Math.min(W / srcW, H / srcH);
  const w = Math.round(srcW * s), h = Math.round(srcH * s);
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

function readFrameIndex(v, rect) {
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cx.drawImage(v, 0, 0);
  const bw = rect.w / 3, bh = rect.h / 9;   // top third, 3x3 blocks
  let idx = 0;
  for (let bit = 0; bit < 9; bit++) {
    const r = Math.floor(bit / 3), c = bit % 3;
    const px = cx.getImageData(
      Math.round(rect.x + c * bw + bw / 2),
      Math.round(rect.y + r * bh + bh / 2), 1, 1).data;
    const lum = (px[0] + px[1] + px[2]) / 3;
    if (lum > 128) idx |= (1 << bit);
  }
  return idx;
}

function readTint(v) {
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cx.drawImage(v, 0, 0);
  const d = cx.getImageData(Math.round(v.videoWidth * 0.92),
                            Math.round(v.videoHeight * 0.5), 1, 1).data;
  return [d[0], d[1], d[2]];
}

// --- primitives -----------------------------------------------------------

// Every wait here is bounded. An unbounded one turns a measurable failure into
// a hang, and "the spike never finished" is not an answer to §6.
function withTimeout(p, ms, label) {
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout: ' + label)), ms)),
  ]);
}

const onceEvt = (el, name, ms = 5000) => withTimeout(
  new Promise(r => el.addEventListener(name, r, { once: true })), ms, name);

function nextFrame(v, ms = 3000) {            // one rVFC tick
  return withTimeout(
    new Promise(r => v.requestVideoFrameCallback((now, meta) => r({ now, meta }))),
    ms, 'rVFC');
}

// rAF and rVFC do not fire at all in a hidden page. That is not a harness bug —
// it is a property of the platform the Monitor will be built on, and it is
// recorded as a finding. Here it just means a paint tick must not be the thing
// a measurement waits on.
function paintTick(ms = 120) {
  return new Promise(r => {
    let settled = false;
    requestAnimationFrame(() => { if (!settled) { settled = true; r('raf'); } });
    setTimeout(() => { if (!settled) { settled = true; r('timeout'); } }, ms);
  });
}
const raf = paintTick;

// Does rVFC actually fire here? Presentation-accurate timing depends on it, and
// claiming a gap measured without it would be dressing a guess as a number.
async function rvfcLive(v) {
  try { await nextFrame(v, 400); return true; } catch { return false; }
}

// Wall-clock cost of a media element actually starting to advance.
//
// This MUST be event-driven. A setInterval poll is throttled to 1 Hz in a
// hidden page, which silently pins every result to ~1000 ms — a number that
// looks like a measurement and is really the throttle floor. Media events are
// not throttled that way, because playback itself is not suspended.
// Wall-clock from calling play() to the 'playing' event — the moment the
// element reports playback has actually begun.
//
// NOT 'timeupdate': that fires roughly every 250 ms, so anything measured by
// waiting for it is floored at ~250 ms. Two strategies that differ by 30 ms
// then look identical, and the floor gets reported as the cost of a cut.
function untilPlaying(v, ms = 4000) {
  const t0 = performance.now();
  return new Promise((res, rej) => {
    let settled = false;
    const done = (fn, arg) => {
      if (settled) return;
      settled = true;
      v.removeEventListener('playing', onPlaying);
      fn(arg);
    };
    const onPlaying = () => done(res, performance.now() - t0);
    v.addEventListener('playing', onPlaying);
    v.play().catch(e => done(rej, e));
    setTimeout(() => done(rej, new Error('never reached playing')), ms);
  });
}

// Sample (wall, media) at two real timeupdate events and take the ratio. Both
// numbers come off the SAME event, so there is no timer skew between them and
// the result is a true effective rate rather than a poll artefact.
function rateOverSpan(v, minMediaSpan, ms = 20000) {
  return new Promise((res, rej) => {
    let first = null, settled = false;
    const finish = (fn, arg) => {
      if (settled) return;
      settled = true;
      v.removeEventListener('timeupdate', onTick);
      fn(arg);
    };
    const onTick = () => {
      const now = performance.now(), media = v.currentTime;
      if (!first) { first = { now, media }; return; }
      if (media - first.media >= minMediaSpan) {
        finish(res, {
          media_span_s: +(media - first.media).toFixed(4),
          wall_ms: +(now - first.now).toFixed(1),
          effective_rate: +((media - first.media) / ((now - first.now) / 1000)).toFixed(3),
          samples: 'two timeupdate events',
        });
      }
    };
    v.addEventListener('timeupdate', onTick);
    setTimeout(() => finish(rej, new Error('rate span never completed')), ms);
  });
}

async function loadInto(v, url) {
  v.src = url;
  v.load();
  await onceEvt(v, 'loadeddata');
  return v;
}

async function seekTo(v, t) {
  // Setting currentTime to the value it already holds fires no 'seeked' event.
  // Waiting for one is then an unbounded wait on an event that will never come.
  if (Math.abs(v.currentTime - t) < 1e-6 && !v.seeking) return 0;
  const t0 = performance.now();
  v.currentTime = t;
  await onceEvt(v, 'seeked');
  return performance.now() - t0;
}

// --- 1 · seek accuracy and latency against the proxy's GOP -----------------

async function testSeek() {
  const clip = FIX.clips.c1;
  const v = document.getElementById('vA');
  await loadInto(v, 'media/' + clip.proxy.path);
  const rect = contentRect(v, clip.source.w, clip.source.h);
  const fps = FIX.fps;
  const keys = clip.proxy.gop.keyframe_times_s;

  const targets = [0.0, 0.5, 1.0, 2.0, 4.0, 8.0, 8.3, 8.4, 9.0, 11.0, 11.9];
  const rows = [];
  for (const t of targets) {
    const latency = await seekTo(v, t);
    // After 'seeked' at readyState 4 the frame is decoded and painted. rVFC is
    // for the TIMING tests; here a paint tick is enough and cannot stall on a
    // paused element that has no new frame to present.
    await raf();
    const shown = readFrameIndex(v, rect);
    const want = Math.floor(t * fps + 1e-6);
    const prevKey = Math.max(...keys.filter(k => k <= t + 1e-6));
    rows.push({
      target_s: t, expected_frame: want, shown_frame: shown,
      frame_error: shown - want,
      error_ms: +(((shown - want) / fps) * 1000).toFixed(2),
      seek_latency_ms: +latency.toFixed(1),
      s_past_keyframe: +(t - prevKey).toFixed(3),
      reported_currentTime: +v.currentTime.toFixed(4),
    });
  }
  const errs = rows.map(r => Math.abs(r.frame_error));
  const lat = rows.map(r => r.seek_latency_ms);
  R.tests.seek = {
    gop_keyframe_interval_s: clip.proxy.gop.max_gap_s,
    rows,
    max_abs_frame_error: Math.max(...errs),
    frame_accurate: Math.max(...errs) === 0,
    seek_latency_ms: { min: Math.min(...lat), max: Math.max(...lat),
                       mean: +(lat.reduce((a, b) => a + b, 0) / lat.length).toFixed(1) },
  };
  log('seek: max frame error ' + Math.max(...errs) + ', latency ' +
      JSON.stringify(R.tests.seek.seek_latency_ms));
}

// --- 2 · the cut: one element re-sought vs two cross-swapped --------------
//
// The gap is measured between the PRESENTATION of clip A's last frame and clip
// B's first, via requestVideoFrameCallback — not between a play() call and an
// event, which would measure our own scheduling rather than the screen's.

function trackFrames(v, bucket) {
  let stop = false;
  const tick = (now, meta) => {
    if (stop) return;
    bucket.push({ t: now, media: meta.mediaTime, present: meta.presentationTime });
    v.requestVideoFrameCallback(tick);
  };
  v.requestVideoFrameCallback(tick);
  return () => { stop = true; };
}

async function testCutSingleElement(repeats = 5) {
  const a = FIX.clips.c1, b = FIX.clips.c3;
  const v = document.getElementById('vA');
  const gaps = [];
  for (let i = 0; i < repeats; i++) {
    await loadInto(v, 'media/' + a.proxy.path);
    await seekTo(v, 6.0);
    const seen = []; const stop = trackFrames(v, seen);
    await v.play();
    await sleep(400);                              // play a little of A
    const lastA = seen[seen.length - 1];
    stop();
    v.pause();
    const t0 = performance.now();
    await loadInto(v, 'media/' + b.proxy.path);    // the swap: reload + seek
    await seekTo(v, 2.0);
    const seenB = []; const stopB = trackFrames(v, seenB);
    await v.play();
    await nextFrame(v);
    stopB(); v.pause();
    const firstB = seenB[0];
    gaps.push(+( (firstB ? firstB.t : performance.now()) - (lastA ? lastA.t : t0) ).toFixed(1));
  }
  return gaps;
}

async function testCutTwoElements(repeats = 5) {
  const a = FIX.clips.c1, b = FIX.clips.c3;
  const vA = document.getElementById('vA'), vB = document.getElementById('vB');
  const gaps = [];
  for (let i = 0; i < repeats; i++) {
    await loadInto(vA, 'media/' + a.proxy.path);
    await seekTo(vA, 6.0);
    // B is prepared IN ADVANCE — that is the whole point of the two-element
    // strategy: the reload and the seek happen while A is still playing.
    await loadInto(vB, 'media/' + b.proxy.path);
    await seekTo(vB, 2.0);

    const seenA = []; const stopA = trackFrames(vA, seenA);
    await vA.play();
    await sleep(400);
    const seenB = []; const stopB = trackFrames(vB, seenB);
    const p = vB.play();                            // swap
    stopA(); vA.pause();
    const lastA = seenA[seenA.length - 1];
    await p;
    await nextFrame(vB);
    stopB(); vB.pause();
    const firstB = seenB[0];
    gaps.push(+((firstB ? firstB.t : performance.now()) - (lastA ? lastA.t : 0)).toFixed(1));
  }
  return gaps;
}

const stats = (xs) => ({
  min: Math.min(...xs), max: Math.max(...xs),
  mean: +(xs.reduce((a, b) => a + b, 0) / xs.length).toFixed(1),
  median: xs.slice().sort((x, y) => x - y)[Math.floor(xs.length / 2)],
  samples: xs,
});

// The decomposition: what each strategy actually costs, measured with events and
// currentTime rather than presentation timestamps. This runs everywhere, and it
// is what the design decision turns on — the two strategies differ by WHERE the
// load-and-seek happens, not by how fast a frame paints.
async function testCutDecomposed(repeats = 5) {
  const a = FIX.clips.c1, b = FIX.clips.c3;
  const v = document.getElementById('vA');
  const vB = document.getElementById('vB');
  const single = [], dual = [], prep = [];

  const parts = [];
  for (let i = 0; i < repeats; i++) {
    // SINGLE ELEMENT: at the cut you must swap src, decode to a keyframe, seek,
    // and only then play. All of it is on the critical path.
    await loadInto(v, 'media/' + a.proxy.path);
    await seekTo(v, 6.0);
    await untilPlaying(v);
    await sleep(250);
    const t0 = performance.now();
    v.pause();
    const l0 = performance.now();
    await loadInto(v, 'media/' + b.proxy.path);
    const lMs = performance.now() - l0;
    const sMs = await seekTo(v, 2.0);
    const pMs = await untilPlaying(v);
    single.push(+(performance.now() - t0).toFixed(1));
    parts.push({ load_ms: +lMs.toFixed(1), seek_ms: +sMs.toFixed(1), play_ms: +pMs.toFixed(1) });
    v.pause();

    // TWO ELEMENTS: the same load and seek happen on B while A is still
    // playing, so the critical path at the cut is only play()->playing.
    await loadInto(v, 'media/' + a.proxy.path);
    await seekTo(v, 6.0);
    const p0 = performance.now();
    await loadInto(vB, 'media/' + b.proxy.path);
    await seekTo(vB, 2.0);
    prep.push(+(performance.now() - p0).toFixed(1));   // paid EARLY, off the cut
    await untilPlaying(v);
    await sleep(250);
    const t1 = performance.now();
    v.pause();
    await untilPlaying(vB);
    dual.push(+(performance.now() - t1).toFixed(1));
    vB.pause();
  }
  return { single, dual, prep, parts };
}

async function testCut() {
  const v = document.getElementById('vA');
  await loadInto(v, 'media/' + FIX.clips.c1.proxy.path);
  await seekTo(v, 3.0);
  await v.play();
  const rvfc = await rvfcLive(v);
  v.pause();

  const dec = await testCutDecomposed();
  R.tests.cut = {
    method: rvfc ? 'presentation timestamps (rVFC) + decomposition'
                 : 'decomposition only, event-driven — rVFC does not fire in a hidden page',
    rvfc_fires: rvfc,
    page_visibility: document.visibilityState,
    caveat: rvfc ? null
      : 'These are TIME-TO-PLAYING costs, not the visible black-frame duration. '
      + 'The gap a viewer actually sees needs presentation timestamps, which need '
      + 'a foregrounded window. The comparison between the two strategies is '
      + 'still valid — both are measured the same way.',
    single_element_swap_ms: stats(dec.single),
    two_element_swap_ms: stats(dec.dual),
    two_element_preparation_cost_ms: stats(dec.prep),
    single_element_breakdown_ms: {
      load: stats(dec.parts.map(p => p.load_ms)),
      seek: stats(dec.parts.map(p => p.seek_ms)),
      play: stats(dec.parts.map(p => p.play_ms)),
    },
    note: 'single = pause->load->seek->play->playing, all on the critical path '
        + 'at the cut. dual = play->playing only; the load and seek are the '
        + 'preparation figure, paid while the previous clip is still playing. '
        + 'Timed on the "playing" event, not "timeupdate" — timeupdate fires at '
        + '~250 ms and would floor both strategies at the same wrong number.',
  };

  if (rvfc) {
    try {
      const s = await testCutSingleElement();
      const d = await testCutTwoElements();
      R.tests.cut.presentation_gap_single_ms = stats(s);
      R.tests.cut.presentation_gap_dual_ms = stats(d);
    } catch (e) {
      R.tests.cut.presentation_gap_error = String((e && e.message) || e);
    }
  }
  log('cut: single ' + stats(dec.single).median + 'ms median, dual '
      + stats(dec.dual).median + 'ms median (rVFC=' + rvfc + ')');
}

// --- 3 · playbackRate preview vs the renderer's setpts --------------------

async function testRate() {
  const clip = FIX.clips.c1;
  const v = document.getElementById('vA');
  const rows = [];
  for (const rate of [1.5, 1.75, 2.0, 2.5]) {
    await loadInto(v, 'media/' + clip.proxy.path);
    await seekTo(v, 1.0);
    v.playbackRate = rate;
    const applied = v.playbackRate;              // browsers may clamp
    await untilPlaying(v);
    const measured = await rateOverSpan(v, 3.0);
    v.pause();
    // Python wrote the keys as str(float): "1.5", "2.0". JS String(2.0) is "2",
    // so a naive lookup misses every whole-number rate.
    const ref = FIX.setpts_reference[String(rate)] ?? FIX.setpts_reference[rate.toFixed(1)];
    if (!ref) throw new Error('no setpts reference for rate ' + rate);
    rows.push({
      requested_rate: rate,
      applied_rate: applied,
      clamped: applied !== rate,
      ...measured,
      rate_error_pct: +(((measured.effective_rate - rate) / rate) * 100).toFixed(2),
      renderer_ref: ref,
      renderer_duration_error_s: +(ref.duration_s - ref.expected_s).toFixed(4),
      renderer_duration_error_pct: +(((ref.duration_s - ref.expected_s) / ref.expected_s) * 100).toFixed(2),
    });
  }
  R.tests.rate = { rows };
  log('rate: ' + rows.map(r => `${r.requested_rate}x->${r.effective_rate}x`).join(' '));
}

// --- 4 · audio: pitch, and whether the proxy has any at all --------------

async function testAudio() {
  const clip = FIX.clips.c1;
  const vp = document.getElementById('vA');
  await loadInto(vp, 'media/' + clip.proxy.path);

  // Does the PROXY — the thing the Monitor actually plays — carry audio?
  const proxyTracks = vp.audioTracks ? vp.audioTracks.length : null;
  const proxyMozHas = ('mozHasAudio' in vp) ? vp.mozHasAudio : null;
  const proxyWebkitDecoded = ('webkitAudioDecodedByteCount' in vp)
    ? vp.webkitAudioDecodedByteCount : null;

  const vs = document.getElementById('vAudio');
  await loadInto(vs, 'media/' + clip.source.path);
  const supportsPreservesPitch = 'preservesPitch' in vs;
  let pitchHonoured = null;
  if (supportsPreservesPitch) {
    vs.preservesPitch = true;
    vs.playbackRate = 1.75;
    pitchHonoured = vs.preservesPitch === true;
  }
  R.tests.audio = {
    proxy_audio_track_count: proxyTracks,
    proxy_mozHasAudio: proxyMozHas,
    proxy_webkitAudioDecodedByteCount: proxyWebkitDecoded,
    proxy_declared_has_audio: clip.proxy.has_audio,
    source_declared_has_audio: clip.source.has_audio,
    supports_preservesPitch: supportsPreservesPitch,
    preservesPitch_settable: pitchHonoured,
    source_tone_hz: clip.source.tone_hz,
  };
  log('audio: proxy has_audio=' + clip.proxy.has_audio +
      ', preservesPitch supported=' + supportsPreservesPitch);
}

// --- 5 · the music bed across a cut and a seek ---------------------------

async function testMusicSync() {
  const a = FIX.clips.c1, b = FIX.clips.c3;
  const vA = document.getElementById('vA'), vB = document.getElementById('vB');
  const music = document.getElementById('music');
  music.src = 'media/music.m4a';
  music.load();
  await onceEvt(music, 'loadeddata');

  await loadInto(vA, 'media/' + a.proxy.path);
  await seekTo(vA, 6.0);
  await loadInto(vB, 'media/' + b.proxy.path);
  await seekTo(vB, 2.0);

  // The reel clock: what the music SHOULD read if it never drifted.
  const reelT0 = 3.0;
  music.currentTime = reelT0;
  const wall0 = performance.now();
  await Promise.all([music.play(), vA.play()]);

  // OFFSET, not drift. The bed lags the wall clock by however long play() took
  // to actually start it; that is a fixed startup cost, and reporting it as
  // "drift" would condemn a bed that is in fact keeping perfect time. Drift is
  // the CHANGE in offset between samples.
  const sample = (label) => ({
    at: label,
    wall_s: +((performance.now() - wall0) / 1000).toFixed(4),
    music_s: +music.currentTime.toFixed(4),
    offset_ms: +(((music.currentTime - reelT0) - (performance.now() - wall0) / 1000) * 1000).toFixed(1),
  });

  await sleep(600);
  const start = sample('after start');

  vA.pause();                       // the cut
  await untilPlaying(vB);
  await sleep(600);
  const afterCut = sample('after cut');

  await seekTo(vB, 7.0);            // a seek mid-reel
  await untilPlaying(vB);
  await sleep(600);
  const afterSeek = sample('after seek');

  music.pause(); vB.pause();
  const offsets = [start, afterCut, afterSeek].map(s => s.offset_ms);
  R.tests.music = {
    method: '<audio> element, wall-clock referenced',
    samples: [start, afterCut, afterSeek],
    startup_offset_ms: start.offset_ms,
    drift_across_cut_ms: +(afterCut.offset_ms - start.offset_ms).toFixed(1),
    drift_across_seek_ms: +(afterSeek.offset_ms - afterCut.offset_ms).toFixed(1),
    max_abs_offset_ms: Math.max(...offsets.map(Math.abs)),
    note: 'The cut and the seek are video-side events; the bed is never touched. '
        + 'A non-zero drift here is the bed reacting to main-thread contention, '
        + 'which is the thing that would desync a reel. Startup offset is '
        + 'reported separately because it is a one-time cost, not drift.',
  };
  log('music: startup offset ' + R.tests.music.startup_offset_ms
      + 'ms, drift across cut ' + R.tests.music.drift_across_cut_ms
      + 'ms, across seek ' + R.tests.music.drift_across_seek_ms + 'ms');
}

// --- driver ---------------------------------------------------------------

async function run() {
  document.getElementById('log').textContent = 'running…';
  FIX = await (await fetch('media/fixtures.json')).json();
  R.env = {
    ua: navigator.userAgent,
    hardwareConcurrency: navigator.hardwareConcurrency,
    devicePixelRatio: devicePixelRatio,
    has_requestVideoFrameCallback: 'requestVideoFrameCallback' in HTMLVideoElement.prototype,
    visibility_at_start: document.visibilityState,
    has_focus: document.hasFocus(),
  };
  // Each test is isolated: one that fails records its failure and the rest
  // still run. A spike that reports four numbers and one honest gap is worth
  // more than one that reports nothing because the last step threw.
  for (const [name, fn] of [['seek', testSeek], ['cut', testCut], ['rate', testRate],
                            ['audio', testAudio], ['music', testMusicSync]]) {
    try {
      await withTimeout(fn(), 90000, name + ' (whole test)');
    } catch (e) {
      R.tests[name] = { failed: String((e && e.message) || e) };
      log('FAILED ' + name + ': ' + R.tests[name].failed);
    }
  }
  window.__RESULTS__ = R;
  window.__DONE__ = true;
  log('\ndone');
}
window.run = run;
</script>
